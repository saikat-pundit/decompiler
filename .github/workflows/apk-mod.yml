name: APK Modding Pipeline

on:
  workflow_dispatch:

jobs:
  mod-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      # ============================================
      # INSTALL APKTOOL (SIMPLIFIED & FIXED)
      # ============================================
      - name: Install Apktool
        run: |
          # Download apktool jar (the actual tool)
          sudo wget -O /usr/local/bin/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          
          # Download and setup the wrapper script
          sudo wget -O /usr/local/bin/apktool https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool
          
          # Make both executable
          sudo chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar
          
          # Create a wrapper script that uses java directly (if the above fails)
          echo '#!/bin/bash
          java -jar /usr/local/bin/apktool.jar "$@"' | sudo tee /usr/local/bin/apktool-jar
          sudo chmod +x /usr/local/bin/apktool-jar
          
          # Test installation
          echo "🔍 Testing Apktool installation..."
          if apktool --version 2>/dev/null; then
            echo "✅ Apktool installed successfully (via wrapper)!"
          elif apktool-jar --version 2>/dev/null; then
            echo "✅ Apktool installed successfully (via java -jar)!"
          else
            echo "⚠️ Apktool installed but version check failed. Continuing anyway..."
          fi
          
          echo "📁 Files installed:"
          ls -la /usr/local/bin/apktool*
      
      # ============================================
      # INSTALL ANDROID SDK TOOLS (Optional)
      # ============================================
      - name: Install Android SDK Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk || echo "Android SDK not available, continuing..."
          echo "ANDROID_HOME=/usr/lib/android-sdk" >> $GITHUB_ENV
          echo "/usr/lib/android-sdk/tools/bin" >> $GITHUB_PATH
          echo "/usr/lib/android-sdk/platform-tools" >> $GITHUB_PATH
          
          # Check if tools are available (non-fatal)
          command -v zipalign && echo "✅ zipalign found" || echo "⚠️ zipalign not found (optional)"
          command -v apksigner && echo "✅ apksigner found" || echo "⚠️ apksigner not found (optional)"
      
      # ============================================
      # INSTALL PYTHON DEPENDENCIES
      # ============================================
      - name: Install Python dependencies
        run: |
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          else
            echo "ℹ️ No requirements.txt found, skipping"
          fi
      
      # ============================================
      # REPACKAGE FROM EXISTING DECOMPILED FOLDER
      # ============================================
      - name: Repackage APK from decompiled folder
        run: |
          # Check if decompiled folder exists
          if [ ! -d "decompiled" ]; then
            echo "❌ ERROR: decompiled folder not found in repository!"
            echo "Please ensure the decompiled folder exists in the root directory"
            exit 1
          fi
          
          echo "📦 Repackaging from existing decompiled folder..."
          
          # Create workspace/output directory
          mkdir -p workspace/output
          
          # Try repackaging with apktool
          echo "🔨 Attempting to repackage with apktool..."
          if apktool b decompiled -o workspace/output/my_app_unsigned.apk; then
            echo "✅ APK repackaged successfully with apktool!"
          else
            echo "🔄 Trying with java -jar alternative..."
            java -jar /usr/local/bin/apktool.jar b decompiled -o workspace/output/my_app_unsigned.apk
            if [ $? -eq 0 ]; then
              echo "✅ APK repackaged successfully with java -jar!"
            else
              echo "❌ Repackaging failed with both methods!"
              exit 1
            fi
          fi
          
          echo "📊 Output:"
          ls -la workspace/output/
      
      # ============================================
      # ALIGN THE APK (Optional)
      # ============================================
      - name: Align APK
        run: |
          if command -v zipalign &> /dev/null; then
            echo "📐 Aligning APK..."
            zipalign -v -p 4 workspace/output/my_app_unsigned.apk workspace/output/my_app_aligned.apk
            echo "✅ APK aligned successfully!"
          else
            echo "⚠️ zipalign not found, skipping alignment"
            cp workspace/output/my_app_unsigned.apk workspace/output/my_app_aligned.apk
          fi
      
      # ============================================
      # SIGN THE APK
      # ============================================
      - name: Sign APK
        run: |
          echo "🔑 Signing APK..."
          
          # Generate debug keystore
          keytool -genkey -v -keystore debug.keystore \
            -alias debug \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, ST=Debug, C=US" \
            -noprompt 2>/dev/null || true
          
          # Sign using apksigner or jarsigner
          if command -v apksigner &> /dev/null; then
            apksigner sign \
              --ks debug.keystore \
              --ks-key-alias debug \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out workspace/output/my_app_signed.apk \
              workspace/output/my_app_aligned.apk
            echo "✅ APK signed with apksigner!"
          else
            # Fallback to jarsigner
            echo "🔄 Using jarsigner fallback..."
            jarsigner -verbose \
              -sigalg SHA1withRSA \
              -digestalg SHA1 \
              -keystore debug.keystore \
              -storepass android \
              -keypass android \
              workspace/output/my_app_aligned.apk debug
            mv workspace/output/my_app_aligned.apk workspace/output/my_app_signed.apk
            echo "✅ APK signed with jarsigner (fallback)!"
          fi
          
          echo "📦 Signed APK:"
          ls -la workspace/output/my_app_signed.apk
      
      # ============================================
      # VERIFY THE SIGNED APK
      # ============================================
      - name: Verify APK
        run: |
          if command -v apksigner &> /dev/null; then
            echo "🔍 Verifying APK signature..."
            apksigner verify workspace/output/my_app_signed.apk && echo "✅ APK verification passed!" || echo "⚠️ APK verification failed"
          else
            echo "ℹ️ apksigner not available, skipping verification"
          fi
      
      # ============================================
      # UPLOAD ARTIFACTS
      # ============================================
      - name: Upload modded APK
        uses: actions/upload-artifact@v4
        with:
          name: modded-apk
          path: workspace/output/my_app_signed.apk
          retention-days: 30
          if-no-files-found: error
      
      - name: Upload repackaged files (optional)
        uses: actions/upload-artifact@v4
        with:
          name: repackaged-files
          path: workspace/output/
          retention-days: 7
          if-no-files-found: warn
      
      # ============================================
      # WORKFLOW SUMMARY
      # ============================================
      - name: Workflow Summary
        run: |
          echo "========================================="
          echo "✅ WORKFLOW COMPLETED"
          echo "========================================="
          echo ""
          echo "📦 What happened:"
          echo "  - Repackaged from existing 'decompiled/' folder"
          echo "  - Aligned the APK"
          echo "  - Signed with debug keystore"
          echo ""
          echo "📥 Download from Artifacts:"
          echo "  - modded-apk: Final signed APK"
          echo ""
          echo "📊 Output size:"
          ls -lh workspace/output/my_app_signed.apk 2>/dev/null || echo "  (APK not found)"
          echo ""
          echo "========================================="
