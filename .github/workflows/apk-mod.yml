name: APK Modding with Docker

on:
  workflow_dispatch:

jobs:
  mod-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Decompile, Edit, and Repackage
        run: |
          # Use Docker with Apktool pre-installed
          docker run --rm -v $(pwd):/workspace -w /workspace \
            openjdk:17-jdk-slim bash -c "
            # Install apktool inside container
            apt-get update && apt-get install -y wget
            wget -O /usr/local/bin/apktool https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool
            chmod +x /usr/local/bin/apktool
            wget -O /usr/local/bin/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool.jar
            chmod +x /usr/local/bin/apktool.jar
            
            # Decompile
            apktool d my.apk -o decompiled -f
            
            # === YOUR EDITS HERE ===
            # sed -i 's/old/new/g' decompiled/AndroidManifest.xml
            
            # Repackage
            apktool b decompiled -o my_app.apk
            
            echo '✅ Done!'
          "
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: modded-apk
          path: my_app.apk
          retention-days: 30
          
      - name: Upload decompiled files
        uses: actions/upload-artifact@v4
        with:
          name: decompiled-files
          path: decompiled/
          retention-days: 30
          
      - name: Push to repo
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git rm -rf decompiled 2>/dev/null || true
          cp -r decompiled .
          git add decompiled/
          git commit -m "Update decompiled files [skip ci]" || echo "No changes"
          git push || true
