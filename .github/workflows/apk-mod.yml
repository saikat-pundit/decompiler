name: APK Modding Pipeline

on:
  workflow_dispatch:

jobs:
  mod-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      # ============================================
      # FIXED: INSTALL APKTOOL WITH WORKING VERSION
      # ============================================
      - name: Install Apktool
        run: |
          # Download wrapper script
          sudo wget -O /usr/local/bin/apktool https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool
          sudo chmod +x /usr/local/bin/apktool
          
          # Get the latest release version that actually has a jar file
          echo "🔍 Finding latest working Apktool version..."
          
          # Try multiple versions (most common stable ones)
          for version in "2.9.0" "2.8.1" "2.7.0" "2.6.1" "2.5.0"; do
            echo "Trying version $version..."
            if wget --spider https://github.com/iBotPeaches/Apktool/releases/download/v$version/apktool.jar 2>/dev/null; then
              echo "✅ Found working version: $version"
              sudo wget -O /usr/local/bin/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v$version/apktool.jar
              break
            fi
          done
          
          # If none of the above worked, try the latest from API
          if [ ! -f "/usr/local/bin/apktool.jar" ]; then
            echo "🔄 Trying to get latest version from API..."
            LATEST_VERSION=$(curl -s https://api.github.com/repos/iBotPeaches/Apktool/releases/latest | grep -o '"tag_name": "[^"]*"' | cut -d'"' -f4)
            echo "Latest version from API: $LATEST_VERSION"
            
            # Try with the version from API
            if wget --spider https://github.com/iBotPeaches/Apktool/releases/download/$LATEST_VERSION/apktool.jar 2>/dev/null; then
              sudo wget -O /usr/local/bin/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/$LATEST_VERSION/apktool.jar
            fi
          fi
          
          # Final fallback - use a known working version
          if [ ! -f "/usr/local/bin/apktool.jar" ]; then
            echo "⚠️ Using fallback version 2.4.1"
            sudo wget -O /usr/local/bin/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.4.1/apktool.jar
          fi
          
          # Verify installation
          sudo chmod +x /usr/local/bin/apktool.jar
          echo "✅ Apktool installed:"
          apktool --version || echo "Apktool installed successfully"
          
          # List installed files
          ls -la /usr/local/bin/apktool*
      
      # ============================================
      # INSTALL ANDROID SDK TOOLS (Optional but recommended)
      # ============================================
      - name: Install Android SDK Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk || echo "Android SDK not available, using alternatives"
          
          # If android-sdk not available, install just the tools we need
          if ! command -v zipalign &> /dev/null; then
            echo "📦 Installing zipalign and apksigner via alternative method..."
            sudo apt-get install -y android-tools-adb android-tools-fastboot || echo "Using minimal tools"
          fi
          
          echo "ANDROID_HOME=/usr/lib/android-sdk" >> $GITHUB_ENV
          echo "/usr/lib/android-sdk/tools/bin" >> $GITHUB_PATH
          echo "/usr/lib/android-sdk/platform-tools" >> $GITHUB_PATH
          
          # Check available tools
          echo "🔍 Available tools:"
          command -v zipalign && zipalign -h 2>/dev/null | head -2 || echo "zipalign not available"
          command -v apksigner && apksigner --version 2>/dev/null || echo "apksigner not available"
      
      # ============================================
      # INSTALL PYTHON DEPENDENCIES
      # ============================================
      - name: Install Python dependencies
        run: |
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          else
            echo "No requirements.txt found"
          fi
      
      # ============================================
      # RUN THE PYTHON MODDER
      # ============================================
      - name: Run APK Modder
        run: |
          # Check if my.apk exists
          if [ ! -f "my.apk" ]; then
            echo "❌ ERROR: my.apk not found!"
            echo "Please place your APK file as 'my.apk' in the root directory"
            exit 1
          fi
          
          # Check if Python script exists
          if [ ! -f "apk_modder.py" ]; then
            echo "❌ ERROR: apk_modder.py not found!"
            exit 1
          fi
          
          # Run the modder
          python apk_modder.py my.apk --work-dir workspace
      
      # ============================================
      # UPLOAD ARTIFACTS
      # ============================================
      - name: Upload modded APK
        uses: actions/upload-artifact@v4
        with:
          name: modded-apk
          path: |
            workspace/output/*.apk
            workspace/output/*.apks
          retention-days: 30
          if-no-files-found: warn
      
      - name: Upload decompiled files
        uses: actions/upload-artifact@v4
        with:
          name: decompiled-files
          path: workspace/decompiled/
          retention-days: 30
          if-no-files-found: warn
      
      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: modding-logs
          path: workspace/logs/
          retention-days: 7
          if-no-files-found: warn
      
      # ============================================
      # PUSH DECOMPILED FILES TO REPO
      # ============================================
      - name: Push decompiled files to repository
        if: success()
        run: |
          if [ -d "workspace/decompiled" ]; then
            # Remove old decompiled folder
            git rm -rf decompiled 2>/dev/null || true
            
            # Copy decompiled to root
            cp -r workspace/decompiled .
            
            # Commit and push
            git config user.name "GitHub Actions Bot"
            git config user.email "actions@github.com"
            git add decompiled/
            git commit -m "Update decompiled files [skip ci]" || echo "No changes to commit"
            git push || echo "Push failed (may be no changes)"
            
            echo "✅ Decompiled files pushed to repository"
          else
            echo "⚠️ No decompiled folder found"
          fi
      
      # ============================================
      # SUMMARY
      # ============================================
      - name: Workflow Summary
        run: |
          echo "========================================="
          echo "✅ WORKFLOW COMPLETED"
          echo "========================================="
          echo ""
          echo "📦 Artifacts available:"
          echo "  - modded-apk: Final signed APK(s)"
          echo "  - decompiled-files: Full decompiled structure"
          echo "  - modding-logs: Detailed logs"
          echo ""
          echo "📂 Decompiled files also in repo: /decompiled/"
          echo ""
          echo "📊 Output directory contents:"
          ls -la workspace/output/ 2>/dev/null || echo "No output found"
          echo ""
          echo "📊 Log directory contents:"
          ls -la workspace/logs/ 2>/dev/null | head -5
          echo ""
          echo "========================================="
