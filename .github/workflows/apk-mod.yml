name: APK Modding Pipeline

on:
  workflow_dispatch:

jobs:
  mod-apk:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      # === FIXED: Install Apktool with version detection ===
      - name: Install Apktool
        run: |
          # Download the wrapper script
          sudo wget -O /usr/local/bin/apktool https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool
          sudo chmod +x /usr/local/bin/apktool
          
          # Get the LATEST release version dynamically
          LATEST_VERSION=$(curl -s https://api.github.com/repos/iBotPeaches/Apktool/releases/latest | grep -oP '"tag_name": "\K(.*?)(?=")')
          echo "Latest Apktool version: $LATEST_VERSION"
          
          # Download the correct JAR
          sudo wget -O /usr/local/bin/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/$LATEST_VERSION/apktool.jar
          sudo chmod +x /usr/local/bin/apktool.jar
          
          # Test installation
          apktool --version
          
      # === FIXED: Install zipalign and apksigner from Android SDK ===
      - name: Install Android SDK Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          
          # Download command-line tools
          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip commandlinetools-linux-*.zip
          mkdir -p android-sdk/cmdline-tools
          mv cmdline-tools android-sdk/cmdline-tools/latest
          
          # Set environment
          echo "ANDROID_HOME=$PWD/android-sdk" >> $GITHUB_ENV
          echo "$PWD/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          
          # Accept licenses
          yes | android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          
          # Install build-tools (includes zipalign and apksigner)
          android-sdk/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" > /dev/null 2>&1
          
          # Add to PATH
          echo "$PWD/android-sdk/build-tools/34.0.0" >> $GITHUB_PATH
          
      # === DECOMPILE ===
      - name: Decompile APK
        run: |
          # Check if APK exists
          if [ ! -f "my.apk" ]; then
            echo "❌ Error: my.apk not found in root directory!"
            exit 1
          fi
          
          # Clean previous decompile if exists
          rm -rf decompiled
          
          # Decompile with verbose output
          apktool d my.apk -o decompiled -f
          echo "✅ APK decompiled successfully"
          echo "📁 Files extracted: $(find decompiled -type f | wc -l) files"
          
      # === MAKE YOUR EDITS ===
      - name: Apply modifications
        run: |
          echo "📝 Starting modifications..."
          
          # === ADD YOUR CUSTOM EDITS BELOW ===
          
          # Example 1: Show current app name from manifest
          echo "Current app name:"
          grep -o 'android:label="[^"]*"' decompiled/AndroidManifest.xml | head -1 || echo "Not found"
          
          # Example 2: Change app label (uncomment to use)
          # sed -i 's/android:label="[^"]*"/android:label="My Modded App"/' decompiled/AndroidManifest.xml
          
          # Example 3: Remove a permission (uncomment and modify)
          # sed -i '/<uses-permission android:name="android.permission.INTERNET"\/>/d' decompiled/AndroidManifest.xml
          
          # Example 4: Modify a Smali file (uncomment and adjust path)
          # if [ -f "decompiled/smali/com/example/MainActivity.smali" ]; then
          #   sed -i 's/const\/4 v0, 0x1/const\/4 v0, 0x0/g' decompiled/smali/com/example/MainActivity.smali
          #   echo "✅ Modified MainActivity.smali"
          # fi
          
          # Example 5: Replace a resource (uncomment)
          # cp your_custom_file.png decompiled/res/drawable/
          
          echo "✅ Modifications complete"
          
          # Show what was modified
          echo "📂 Modified files in last 5 minutes:"
          find decompiled -type f -mmin -5 2>/dev/null | head -20 || echo "No recent modifications"
          
      # === REPACKAGE ===
      - name: Repackage APK
        run: |
          apktool b decompiled -o my_app_unsigned.apk
          echo "✅ APK repackaged successfully"
          ls -lh my_app_unsigned.apk
          
      # === ALIGN ===
      - name: Align APK
        run: |
          zipalign -v -p 4 my_app_unsigned.apk my_app_aligned.apk
          echo "✅ APK aligned"
          
      # === SIGN ===
      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore \
            -alias debug \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, ST=Debug, C=US"
          echo "✅ Keystore generated"
          
      - name: Sign APK
        run: |
          # Try v2 signing first, fallback to v1 only
          apksigner sign \
            --ks debug.keystore \
            --ks-key-alias debug \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            my_app_aligned.apk
          echo "✅ APK signed"
          
      # === VERIFY ===
      - name: Verify APK
        run: |
          apksigner verify --verbose my_app_aligned.apk
          echo "✅ Verification passed"
          
      # === UPLOAD ===
      - name: Upload modded APK
        uses: actions/upload-artifact@v4
        with:
          name: modded-apk
          path: my_app_aligned.apk
          retention-days: 30
          
      # === SUMMARY ===
      - name: Show summary
        run: |
          echo "🎉 Build Complete!"
          echo "=================="
          echo "📦 Original: my.apk"
          echo "📦 Modded:   my_app_aligned.apk"
          echo "📏 Size:     $(du -h my_app_aligned.apk | cut -f1)"
          echo ""
          echo "📁 Decompiled structure:"
          ls -la decompiled/ | head -15
