name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Find and rename APK
        run: |
          # Find any APK file in the repository
          APK_FILE=$(find . -name "*.apk" -type f | head -1)
          
          if [ -n "$APK_FILE" ]; then
            echo "Found APK: $APK_FILE"
            cp "$APK_FILE" app-unsigned.apk
          else
            echo "No APK found. Please upload the original APK."
            exit 1
          fi
      
      - name: Generate debug keystore
        run: |
          keytool -genkey -v -keystore debug.keystore \
            -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 \
            -dname "CN=Android Debug, O=Android, C=US" \
            -validity 10000
      
      - name: Re-sign APK
        run: |
          # First remove existing signature
          zip -d app-unsigned.apk 'META-INF/*' 2>/dev/null || true
          
          # Sign with new keystore
          jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 \
            -keystore debug.keystore -storepass android \
            -keypass android app-unsigned.apk androiddebugkey
          
          mv app-unsigned.apk app-signed.apk
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-signed
          path: app-signed.apk
