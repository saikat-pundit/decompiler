name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Build APK by zipping
        run: |
          # Create APK structure
          mkdir -p build/apk
          
          # Copy everything from resources
          cp -r resources/* build/apk/
          
          # Ensure AndroidManifest is in root
          if [ -f "resources/AndroidManifest.xml" ]; then
            cp resources/AndroidManifest.xml build/apk/
          fi
          
          # Zip everything
          cd build/apk
          zip -r -q ../app-unsigned.apk *
          cd ../..
      
      - name: Generate debug keystore
        run: |
          keytool -genkey -v -keystore debug.keystore \
            -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 \
            -dname "CN=Android Debug, O=Android, C=US" \
            -validity 10000
      
      - name: Sign APK
        run: |
          jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 \
            -keystore debug.keystore -storepass android \
            -keypass android build/app-unsigned.apk androiddebugkey
          
          mv build/app-unsigned.apk app-signed.apk
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-signed
          path: app-signed.apk
