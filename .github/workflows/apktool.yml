name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Install apktool
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          
          # Download apktool
          wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool
          chmod +x apktool
          sudo mv apktool /usr/local/bin/
          
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          sudo mv apktool_2.9.3.jar /usr/local/bin/apktool.jar
      
      - name: Prepare for apktool
        run: |
          # Apktool expects resources/ at root with AndroidManifest.xml inside it
          # Move AndroidManifest.xml into resources/ if it's outside
          if [ -f "AndroidManifest.xml" ]; then
            mv AndroidManifest.xml resources/
          fi
          
          # Create apktool.yml
          cat > apktool.yml << 'EOF'
          !brut.androlib.meta.MetaInfo
          apkFileName: app.apk
          compressionType: false
          doNotCompress:
          - resources.arsc
          - png
          - jpg
          - gif
          - wav
          - mp4
          - webp
          - ogg
          - md
          - bin
          - ttf
          - json
          - xml
          - svg
          - otf
          isFrameworkApk: false
          packageInfo:
            forcedPackageId: '127'
            renameManifestPackage: null
          sdkInfo:
            minSdkVersion: '24'
            targetSdkVersion: '36'
          sharedLibrary: false
          unknownFiles: {}
          usesFramework:
            ids:
            - 1
            tag: null
          version: 2.9.3
          versionInfo:
            versionCode: '10907'
            versionName: 1.9.7
          EOF
      
      - name: Build APK with apktool
        run: |
          apktool b resources/ -o app-unsigned.apk
      
      - name: Generate debug keystore
        run: |
          keytool -genkey -v -keystore debug.keystore \
            -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 \
            -dname "CN=Android Debug, O=Android, C=US" \
            -validity 10000
      
      - name: Sign APK
        run: |
          jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 \
            -keystore debug.keystore -storepass android \
            -keypass android app-unsigned.apk androiddebugkey
          
          mv app-unsigned.apk app-signed.apk
      
      - name: Verify APK
        run: |
          echo "APK size:"
          ls -lh app-signed.apk
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-signed
          path: app-signed.apk
