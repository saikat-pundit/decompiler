name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34'
      
      - name: Install required tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dx
      
      - name: Compile Java sources to DEX
        run: |
          # Create build directory
          mkdir -p build/classes
          mkdir -p build/apk
          
          # Compile Java files
          javac -d build/classes \
            -cp $ANDROID_HOME/platforms/android-34/android.jar \
            $(find sources -name "*.java") 2>/dev/null || true
          
          # Convert to DEX
          dx --dex --output=build/classes.dex build/classes
          
          # If dx fails, use d8
          if [ ! -f "build/classes.dex" ]; then
            $ANDROID_HOME/build-tools/34.0.0/d8 \
              --lib $ANDROID_HOME/platforms/android-34/android.jar \
              --output build/classes.dex \
              $(find build/classes -name "*.class")
          fi
      
      - name: Build APK structure
        run: |
          # Create APK structure
          mkdir -p build/apk
          
          # Copy resources
          cp -r resources/* build/apk/
          
          # Copy DEX file
          cp build/classes.dex build/apk/classes.dex
          
          # Copy AndroidManifest
          if [ -f "resources/AndroidManifest.xml" ]; then
            cp resources/AndroidManifest.xml build/apk/
          fi
          
          # Zip into APK
          cd build/apk
          zip -r -q ../app-unsigned.apk *
          cd ../..
      
      - name: Generate debug keystore
        run: |
          keytool -genkey -v -keystore debug.keystore \
            -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 \
            -dname "CN=Android Debug, O=Android, C=US" \
            -validity 10000
      
      - name: Sign APK
        run: |
          jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 \
            -keystore debug.keystore -storepass android \
            -keypass android build/app-unsigned.apk androiddebugkey
          
          mv build/app-unsigned.apk app-signed.apk
      
      - name: Verify APK
        run: |
          echo "APK size:"
          ls -lh app-signed.apk
          
          echo "APK contents:"
          unzip -l app-signed.apk | head -30
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-signed
          path: app-signed.apk
