name: Build Universal XAPK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Install Apktool
        run: |
          sudo wget -q -O /usr/local/bin/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          sudo wget -q -O /usr/local/bin/apktool https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool
          sudo chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar
      
      - name: Install Android Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq android-sdk apksigner || echo "Installed"
      
      # ============================================
      # FIX: Override armv7_split manifest AND apktool.yml
      # ============================================
      - name: Fix armv7_split manifest
        run: |
          if [ -d "decompiled/armv7_split" ]; then
            echo "🔧 Fixing armv7_split/AndroidManifest.xml and apktool.yml..."
            
            # Override AndroidManifest.xml
            cat > decompiled/armv7_split/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="ins.mdm.app"
              android:versionCode="1"
              android:versionName="1.0">
              
              <application
                  android:extractNativeLibs="true"
                  android:hasCode="true">
                  
                  <meta-data
                      android:name="com.android.vending.derived.apk.id"
                      android:value="2"/>
              </application>
          </manifest>
          EOF
            
            # Override apktool.yml - NO QUOTES around numbers!
            cat > decompiled/armv7_split/apktool.yml << 'EOF'
          version: 2.0.0
          apkFileName: armv7_split.apk
          isFrameworkApk: false
          usesFramework:
            ids:
            - 1
          sdkInfo:
            minSdkVersion: 21
            targetSdkVersion: 30
          packageInfo:
            forcedPackageId: 127
          versionInfo:
            versionCode: 1
            versionName: "1.0"
          compressionType: false
          sharedLibrary: false
          unknownFiles: {}
          doNotCompress: null
          EOF
            
            echo "✅ Fixed armv7_split manifest and apktool.yml"
            
            echo "📂 armv7_split/apktool.yml:"
            cat decompiled/armv7_split/apktool.yml
          else
            echo "⚠️ armv7_split directory not found, skipping fix"
          fi
      
      # ============================================
      # Build XAPK
      # ============================================
      - name: Build XAPK
        run: |
          if [ ! -d "decompiled" ]; then
            echo "❌ decompiled folder not found!"
            exit 1
          fi
          python rebuild_xapk.py --decompiled-dir decompiled --output modded_app.xapk
      
      - name: Upload XAPK
        uses: actions/upload-artifact@v4
        with:
          name: modded-xapk
          path: modded_app.xapk
          retention-days: 30
