name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Install Cordova
        run: npm install -g cordova
      
      - name: Install dependencies
        run: |
          # Install required Android SDK packages
          yes | sdkmanager "platforms;android-34" "build-tools;34.0.0"
      
      - name: Create Cordova project structure
        run: |
          # Create Cordova project
          cordova create temp com.example.app MDM
          cd temp
          
          # Copy your files
          rm -rf www/*
          cp -r ../resources/assets/www/* www/
          
          # Copy Android platform
          mkdir -p platforms/android
          cp -r ../resources/* platforms/android/
          cp ../resources/AndroidManifest.xml platforms/android/
          
          # Copy sources
          mkdir -p platforms/android/app/src/main/java
          cp -r ../sources/* platforms/android/app/src/main/java/
          
          # Create local.properties
          echo "sdk.dir=$ANDROID_HOME" > platforms/android/local.properties
      
      - name: Build APK
        run: |
          cd temp
          cordova build android --release
      
      - name: Find and upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: temp/platforms/android/app/build/outputs/apk/release/*.apk
