name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Install apktool
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          
          wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool
          chmod +x apktool
          sudo mv apktool /usr/local/bin/
          
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          sudo mv apktool_2.9.3.jar /usr/local/bin/apktool.jar
      
      - name: Rebuild APK with apktool
        run: |
          # Since resources/ is at root, just build from current directory
          apktool b . -o app-unsigned.apk
      
      - name: Generate debug keystore
        run: |
          keytool -genkey -v -keystore debug.keystore \
            -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 \
            -dname "CN=Android Debug, O=Android, C=US" \
            -validity 10000
      
      - name: Sign APK
        run: |
          # Use jarsigner (available with JDK)
          jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 \
            -keystore debug.keystore -storepass android \
            -keypass android app-unsigned.apk androiddebugkey
          
          mv app-unsigned.apk app-signed.apk
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-signed
          path: app-signed.apk
