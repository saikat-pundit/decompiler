    function checknet(){
        if(navigator.onLine==true){
            profile_details();
        }
        else{
            alert("No Internet Connection");
            window.location = "Dashboard.html";
        }
    }

	function profile_details()
	{
	$("#preloader").fadeIn();
	$.ajax({
    type: "GET",
    //url: "https://mdm.wbsed.gov.in/mdm_app/mdm/token_check_final",
    //url: "https://mdm.wbsed.gov.in/Inspection_Apps/mdm_es_inspection_app/mdm_es_insp/token_check_final",
    url: "https://pmposhan.wb.gov.in/Inspection_Apps/Mdm_es_insp/token_check_final",
    data:{
	authuser:'16288adbe9a7cb4baeb0f0d8df7ba4bb',
	authpassword:'001b6d7734d59c236d8eef95842f254e',
    token:localStorage.getItem("token"),
    phno:localStorage.getItem("phno")
	},
    dataType:"JSON",
    success: function(result)
   {
    //alert(JSON.stringify(result));
	 if(result.code=='1')
	 {
	  $.ajax({
    type: "GET",
    //url: "https://mdm.wbsed.gov.in/mdmappv3/Common/get_profile_details",
    url: "https://pmposhan.wb.gov.in/mdmappv3/Common/get_profile_details",
    data:{
	token:'ba0b38a250289cc85a5ad60ca7712997',
	mobile_no:localStorage.getItem("phno")	
	},
    dataType:"JSON",
    success: function(result)
   {
  // alert(JSON.stringify(result.profile_code_pk));
   
      $(".inner_header_bottom h3").append(result.full_name);
	  $("#pname h3").append(result.full_name);
	  $("#posting_place h3").append(result.posting_place);
      $("#joining_date h3").append(result.joining_from);
	  $("#office_address h3").append(result.office_address);
	  $("#mobile_no h3").append(result.mobile_no);
	  $("#email h3 ").append(result.email);
	  $("#designation h3").append(result.designation_name);
	  $("#preloader").fadeOut();				
   },
	error: function(){
		}
	})
	
	}
    else if(result.code=='0')
    {
     alert(result.msg);
    }
 }
 })
}
