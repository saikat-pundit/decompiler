	function checklocation(a){

		var networkState = navigator.connection.type;
    var states = {};
    states[Connection.UNKNOWN]  = 'Unknown connection';
    states[Connection.ETHERNET] = 'Ethernet connection';
    states[Connection.WIFI]     = 'WiFi connection';
    states[Connection.CELL_2G]  = 'Cell 2G connection';
    states[Connection.CELL_3G]  = 'Cell 3G connection';
    states[Connection.CELL_4G]  = 'Cell 4G connection';
    states[Connection.CELL]     = 'Cell generic connection';
    states[Connection.NONE]     = 'No network connection';

    
	if ((states[networkState]) != states[Connection.NONE]){

		db.transaction(function(tx) {	
						tx.executeSql('SELECT latitude,longitude FROM SupervisorInspectionForm where Inspection_Id_F=?',[a], function(tx, rs) {
	        			var latitude = rs.rows.item(0).latitude;
						var longitude = rs.rows.item(0).longitude;
						lat = latitude.substr(0,7);
						long = longitude.substr(0,7);
						alert(latitude+','+ longitude);
						alert(lat+','+ longitude);
						//location.reload();		
						//window.location="Dashboard.html"
						});
						});

		$.ajax({
				type: "GET",
				//url: "https://mdm.wbsed.gov.in/Inspection_Apps/mdm_es_inspection_app/mdm_es_insp/check_location_es",
				url: "https://pmposhan.wb.gov.in/Inspection_Apps/Mdm_es_insp/check_location_es",
				data:{
				authuser:'16288adbe9a7cb4baeb0f0d8df7ba4bb',
	            authpassword:'001b6d7734d59c236d8eef95842f254e',
				school_code_fk:localStorage.getItem("School_Code"),
				latitude:lat,
				longitude:long
				},
				dataType:"JSON",
				success: function(result)
				{
					console.log(JSON.stringify(result));
					console.log(result.rows);
					if(result.rows>0)
					{
					alert("Location is not matched");
					//window.location("School_Select_Supervisor.html");
					return false;
					}
					else{
						Sync(a);
					}
					//$("#preloader").fadeOut();
				}
				});
		}
		else{
			alert("Please check your internet connection");
		}
	}

function deleteOfflineData(id){
	var result = confirm("Are you sure want to delete the offline inspection data?");
	if(result == true){
		$("#preloader").fadeIn();
		db.transaction(function(tx) {	
		tx.executeSql('DELETE FROM SupervisorInspectionForm where Inspection_Id_F=?',[id], function(tx, rs) {
		$("#preloader").fadeOut();
		alert("Offline Inspection data successfully removed");
		location.reload();		
	//window.location="Dashboard.html"
		});
	});
	}
	else{

	}
	
}

function Sync(a){
	$("#preloader").fadeIn();

	db.transaction(function(tx) { 
	tx.executeSql('SELECT * FROM SupervisorInspectionForm WHERE Inspection_Id_F = ?',[a], function(tx, rs) {
				//alert(rs.rows.length);
				var l = rs.rows.length;
			  	if(l>0)
				{
		
				$.ajax({
				type: "POST",
				//url: "https://mdm.wbsed.gov.in/Inspection_Apps/mdm_es_inspection_app/mdm_es_insp/Supervisor_Inspection",
				//url: "http://192.168.0.101:80/rtds1/Inspection_Apps/mdm_es_inspection_app/mdm_es_insp/Supervisor_Inspection",
				url: "https://pmposhan.wb.gov.in/Inspection_Apps/Mdm_es_insp/Supervisor_Inspection",
				data:{
					authuser:'16288adbe9a7cb4baeb0f0d8df7ba4bb',
					authpassword:'001b6d7734d59c236d8eef95842f254e',
					state_code:rs.rows.item(0).state_code,
					district_code:rs.rows.item(0).district_code,
					circle_code:rs.rows.item(0).circle_code,
					block_code:rs.rows.item(0).block_code,
					school_code:rs.rows.item(0).school_code,
					visiting_date:rs.rows.item(0).visiting_date_db,
					primary_details:rs.rows.item(0).primary_details,
					upper_primary_details:rs.rows.item(0).upper_primary_details,
					mdm_avail:rs.rows.item(0).mdm_avail,
					primary_avail:rs.rows.item(0).primary_att,
					upper_primary_avail:rs.rows.item(0).upper_primary_att,
					not_running:rs.rows.item(0).not_running,
					other_cause:rs.rows.item(0).other_cause,
					RICESTOCK:rs.rows.item(0).rice_stock,
					cooking_cost:rs.rows.item(0).cooking_cost,
					HONORARIUM:rs.rows.item(0).honorarium,
					daily_sms:rs.rows.item(0).daily_sms,
					DRINKWATER:rs.rows.item(0).drinking_water,
					TOILET:rs.rows.item(0).toilet,
					HYGIENE:rs.rows.item(0).hygiene,
					man_power:rs.rows.item(0).manpower,
					committee:rs.rows.item(0).committee,
					REMARKS:rs.rows.item(0).remarks,
					latitude:rs.rows.item(0).latitude,
					longitude:rs.rows.item(0).longitude,
					enter_by:rs.rows.item(0).supervisor_phone_no,
					enter_by_stake:rs.rows.item(0).enter_by_stake,
					photo1:rs.rows.item(0).image1,
					photo2:rs.rows.item(0).image2,
					photo3:rs.rows.item(0).image3,
					photo4:rs.rows.item(0).image4,
					photo5:rs.rows.item(0).image5
					},
				dataType:"JSON",
				success: function(result)
				{
				$("#preloader").fadeOut();
					//console.log(result);
					//console.log(JSON.stringify(result));
					if(result.status==1){
						alert(result.msg);
						db.transaction(function(tx) {	
						tx.executeSql('DELETE FROM SupervisorInspectionForm where Inspection_Id_F=?',[a], function(tx, rs) {
						location.reload();		
						//window.location="Dashboard.html"
						});
						});
					}
					else if(result.status==0){
						alert(result.msg);
						location.reload();
					}
				},
				error: function (xhr, ajaxOptions, thrownError) 
				{ 
					$("#preloader").fadeOut();
					//alert(xhr.status);
        			//alert(thrownError);
        			console.log(xhr);
        			console.log(ajaxOptions);
        			console.log(thrownError);

				}

				});

			}
					
			}, function(tx, error) {
		    	  alert('SELECT error: ' + error.message);
		   	});	

			});

}
