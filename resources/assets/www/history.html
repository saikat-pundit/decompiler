	function count(){
		$("#preloader").fadeIn();
		 $.ajax({
			type: "GET",
			//url: "https://mdm.wbsed.gov.in/Inspection_Apps/mdm_es_inspection_app/mdm_es_insp/count_inspection",
			//url: "http://192.168.0.101:80/rtds1/Inspection_Apps/mdm_es_inspection_app/mdm_es_insp/count_inspection",
			url: "https://pmposhan.wb.gov.in/Inspection_Apps/Mdm_es_insp/count_inspection",
			data:{
			authuser:'16288adbe9a7cb4baeb0f0d8df7ba4bb',
            authpassword:'001b6d7734d59c236d8eef95842f254e',
			mobile_no:localStorage.getItem("phno")
			},
			dataType:"JSON",
			success: function(result)
			{
				console.log(JSON.stringify(result));
				console.log(result.rows);
				if(result.rows == '0')
				{
					alert("No Inspection Data");
					window.location ="Dashboard.html";
				}
			else
			{
				for(i=0;i<result.rows;i++)
				{
					
					var dt = result.value[i].visiting_date;
					var dd = dt.substr(8,2);
					//alert(dd);
					var mm = dt.substr(5,2);
					//alert(mm);
					var yy = dt.substr(0,4);
					//alert(yy);
					var date = dd+'-'+mm+'-'+yy;
					/////////////////////////////////////////////////
					var sn = result.value[i].school_name;
					
					/////////////////////////////////////////////////
					var Inspection_Id = result.value[i].inspection_code_pk;
					
					
					$("#supervisor").append('<li><div class="students_main_left blue_bg"><h2>Sl.No.<span>'+(i+1)+'</span></h2></div><div class="students_main_right" onclick="Details('+Inspection_Id+');"><h2 class="title">School Name</h2><h3 class="subtitle">'+sn+'</h3><h4 class="title_option">Inspection date:<span>'+date+'</span></h4></div><div class="clearfix"></div></li>');
					
				}
				$("#preloader").fadeOut();
			}
			}
			});

	}
