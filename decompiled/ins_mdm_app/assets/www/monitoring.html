    function officermonitoring(){
        if(localStorage.getItem("stake_level_code") =="1"||localStorage.getItem("stake_level_code") =="2"){
            window.location="officer_district_list.html";
        }
        else if(localStorage.getItem("stake_level_code") == "3"){

        }
        else if(localStorage.getItem("stake_level_code")=="5" || localStorage.getItem("stake_level_code")=="8" || localStorage.getItem("stake_level_code")=="9"){

        }



            //window.location = "officer_district_list.html";
        
    }
