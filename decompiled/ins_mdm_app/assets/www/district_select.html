			block(localStorage.getItem("district_code"));
			school(localStorage.getItem("block_code"));

	////// function school list TO PROCCED TO INSPECTION FORM PAGE //////////
	function schoollist()
	{
/*		
		*/
		if( localStorage.getItem("stake_level_code") == '2' )
		{
		     if($("#dist").val()=='')
			 {
			alert("Select District!");
			$("#dist").focus();
			return false;
		     }
			if($("#block").val()==''){
			alert("Select Block/Munc/Corporation!");
			$("#block").focus();
			return false;
			} 
			if($("#school").val()==''){
			alert("Select school!");
			$("#school").focus();
			return false;
		   }
        }
		if(localStorage.getItem("stake_level_code") == '3')
        {
			if($("#block").val()==''){
				alert("Select Block/Munc/Corporation!");
				$("#block").focus();
				return false;
			}
			if($("#school").val()==''){
				alert("Select school!");
				$("#school").focus();
				return false;
			}
		
        }   
		if(localStorage.getItem("stake_level_code") == '4')
		{
			if($("#block").val()==''){
			    alert("Select Block/Munc/Corporation!");
			    $("#block").focus();
			    return false;
		    }
		    if($("#school").val()==''){
				alert("Select school!");
			    $("#school").focus();
			    return false;
		    }
		
		}
        if(localStorage.getItem("stake_level_code") == '5' || localStorage.getItem("stake_level_code") == '8' || localStorage.getItem("stake_level_code") == '9' ||localStorage.getItem("stake_level_code") == '10' )
		{		
			if($("#school").val()==''){
				alert("Select school!");
				$("#school").focus();
				return false;
		    }	
		}
		localStorage.setItem("school", $("#school option:selected").val());
		window.location = "inspection_form.html";
			
	}
		/////// function district name
		function dist()	
			{	
			//alert("fffffffff");
				$("#preloader").fadeIn();

			data:{
			token:'ba0b38a250289cc85a5ad60ca7712997',
			internal_code:"1"
				},
			dataType:"JSON",
			success : function(result)
			{
			//alert(JSON.stringify(result));

			var district_name = result[i].district_name;

			document.querySelector('#dist').innerHTML +=  msg;
			
			         }	
			$("#dist").change(function(){
				document.querySelector('#block').innerHTML='	<option value="" >Select Block</option>';
				block($("#dist option:selected").val());
				}); 
			$("#preloader").fadeOut();				
			}				
			  });		   
			}
