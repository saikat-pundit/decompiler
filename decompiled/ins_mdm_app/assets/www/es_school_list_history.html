        function onBackKeyDown() {
            if(localStorage.getItem("stake_level_code")=="1" || localStorage.getItem("stake_level_code")=="2"){
                window.location = "es_school_list.html";
            }
            else if(localStorage.getItem("stake_level_code")=="3"){
                window.location = "es_school_list.html";
            }
            else if(localStorage.getItem("stake_level_code")=="14" || localStorage.getItem("stake_level_code")=="15"){
                window.location = "es_school_list.html";
            }
            else if(localStorage.getItem("stake_level_code")=="12"||  localStorage.getItem("stake_level_code")=="5" || localStorage.getItem("stake_level_code")=="8" || localStorage.getItem("stake_level_code")=="9"){

          //window.location = "es_school_list.html";

			$( document ).ready(function() {
			
			if(localStorage.getItem("token")!=null)
		    {
		 
		    }
		    else
		    {
			alert("UnAuthorized Access");
			navigator.app.exitApp();
		    }
			
			$("#preloader").fadeIn();	
			
		$.ajax({
                type: "GET",
            	//url: "https://mdm.wbsed.gov.in/Inspection_Apps/mdm_inspection_app/mdm/es_school_history_count",
                url: "https://pmposhan.wb.gov.in/Inspection_Apps/Mdm/es_school_history_count",
                data:{
            	authuser:'16288adbe9a7cb4baeb0f0d8df7ba4bb',
            	authpassword:'001b6d7734d59c236d8eef95842f254e',
            	school_code:localStorage.getItem("school_code"),
                from_date: localStorage.getItem("fdate"),
                to_date: localStorage.getItem("tdate")
            	},
                dataType:"JSON",
                success: function(result)
               {
                    
            	console.log(JSON.stringify(result));
                if(result.rows>0){
            		for(i=0;i<result.rows;i++)
            		{
                        dt = ((result.data[i].entry_time == null)? "NA" : result.data[i].visiting_date);
                        //alert(dt);
                        var dd = dt.substr(8,2);
                        //alert(dd);
                        var mm = dt.substr(5,2);
                        //alert(mm);
                        var yy = dt.substr(0,4);
                        //alert(yy);
                        var date = dd+'-'+mm+'-'+yy;
                        var latitude = ((result.data[i].latitude == "") ? "NA" : result.data[i].latitude);
                        var longitude = ((result.data[i].longitude == "") ? "NA" : result.data[i].longitude);
                        var inspector_name = ((result.data[i].full_name == null) ? "NA" : result.data[i].full_name)


            	     $("#history").append('<li onclick="gethistorydetails('+result.data[i].inspection_code_pk+')"><div class="students_main_left blue_bg"><h2>Sl.No. <span>'+(i+1)+'</span></h2></div><div class="students_main_right"><h2 class="title">School Name</h2><h3 class="subtitle">'+result.data[i].school_name+'</h3><h4 class="title_option">Inspection Date: <span>'+date+'</span></h4><h4 class="title_option">Latitude: <span>'+latitude+'</span></h4><h4 class="title_option">Longitude: <span>'+longitude+'</span></h4><h4 class="title_option">ES Name: <span>'+inspector_name+'</span></h4></div><div class="clearfix"></div></li>');
            	  
            	    }
            	
            	}
                else{

                }  
            		$("#preloader").fadeOut();
            	
               },

               }

});
