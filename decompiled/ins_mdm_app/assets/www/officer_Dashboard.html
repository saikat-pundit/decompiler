document.addEventListener("deviceready", onDeviceReady, false);
	function onDeviceReady(){
		
		checkAvailability();

		
	}



	function checkAvailability(){
	    cordova.plugins.diagnostic.isGpsLocationAvailable(function(available){
	        console.log("GPS location is " + (available ? "available" : "not available"));
	        if(!available){
	            gps = 0;
	           checkAuthorization();
	        }else{
	            gps = 1;
	            console.log("GPS location is ready to use");
	        }
	    }, function(error){
	        console.error("The following error occurred: "+error);
	    });
	}

	function checkAuthorization(){
	    cordova.plugins.diagnostic.isLocationAuthorized(function(authorized){
	        console.log("Location is " + (authorized ? "authorized" : "unauthorized"));
	        if(authorized){
	            checkDeviceSetting();
	        }else{
	            cordova.plugins.diagnostic.requestLocationAuthorization(function(status){
	                switch(status){
	                    case cordova.plugins.diagnostic.permissionStatus.GRANTED:
	                        console.log("Permission granted");
	                        checkDeviceSetting();
	                        break;
	                    case cordova.plugins.diagnostic.permissionStatus.DENIED:
	                        console.log("Permission denied");
	                        // User denied permission
	                        break;
	                    case cordova.plugins.diagnostic.permissionStatus.DENIED_ALWAYS:
	                        console.log("Permission permanently denied");
	                        // User denied permission permanently
	                        break;
	                }
	            }, function(error){
	                console.error(error);
	            });
	        }
	    }, function(error){
	        console.error("The following error occurred: "+error);
	    });
	}

	function checkDeviceSetting(){
	    cordova.plugins.diagnostic.isGpsLocationEnabled(function(enabled){
	        console.log("GPS location setting is " + (enabled ? "enabled" : "disabled"));
	        if(!enabled){
	            cordova.plugins.locationAccuracy.request(function (success){
	                console.log("Successfully requested high accuracy location mode: "+success.message);
	            }, function onRequestFailure(error){
	                console.error("Accuracy request failed: error code="+error.code+"; error message="+error.message);
	                if(error.code !== cordova.plugins.locationAccuracy.ERROR_USER_DISAGREED){
	                    if(confirm("Failed to automatically set Location Mode to 'High Accuracy'. Would you like to switch to the Location Settings page and do this manually?")){
	                        cordova.plugins.diagnostic.switchToLocationSettings();
	                    }
	                }
	            }, cordova.plugins.locationAccuracy.REQUEST_PRIORITY_HIGH_ACCURACY);
	        }
	    }, function(error){
	        console.error("The following error occurred: "+error);
	    });
	}

	function logoutajax()
	{
		$("#preloader").fadeIn();
		db = window.sqlitePlugin.openDatabase({name: 'MdmInspection.db', location: 'default'});
		db.transaction(function(tx) {
		tx.executeSql('SELECT * FROM InspectionFormTable WHERE mobile_no = ?',[localStorage.getItem("phno")], function(tx,rs){
			if(rs.rows.length>=1)
			{
				alert("Please synchronise all the Draft Inspection data before logout");	
			}
			else
			{
				$.ajax({			
					//url: "https://mdm.wbsed.gov.in/Inspection_Apps/mdm_inspection_app/mdm/mdm_logout_user",
					url: "https://pmposhan.wb.gov.in/Inspection_Apps/Mdm/mdm_logout_user",
					type : 'GET',
					data:{
					authuser:"16288adbe9a7cb4baeb0f0d8df7ba4bb",
					authpassword:"001b6d7734d59c236d8eef95842f254e",						
		            phoneno:localStorage.getItem("phno"),
					token:localStorage.getItem("token"),
					sl_no:localStorage.getItem("sl_no")
					},				
					dataType:"json",
					success : function(data) {
					//alert(JSON.stringify(data));
					 if(data.code=="1")
					 {
						//alert("hiiii");
						localStorage.clear();
						window.location="Welcome.html";
					 }
					 if(data.code=="0")
					 {
						//alert("noooooo");
						localStorage.clear();
						alert(data.msg);
						navigator.app.exitApp();
					 } 
					
					
					$("#preloader").fadeOut();			
					}
					});
			}
		}, function(tx,error){
		console.log('Error: ' + error.message);
		});
		$("#preloader").fadeOut();
		});	
	}
