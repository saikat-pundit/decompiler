   <style>
		table {
		  font-family: arial, sans-serif;

	<script>
		var count;
		$(document).ready(function(){
		 //alert(localStorage.getItem("name"));	
		if(localStorage.getItem("token")!=null)
		{
			//dist();
			var today = new Date().toISOString().split('T')[0];
			$("#f_date").attr('max', today);
			$("#t_date").attr('max', today);

			if(localStorage.getItem("o_fdate")!=null && localStorage.getItem("o_tdate")!=null){
				console.log(localStorage.getItem("o_fdate")+'--'+localStorage.getItem("o_tdate"));
				$("#f_date").val(localStorage.getItem("o_fdate"));
				$("#t_date").val(localStorage.getItem("o_tdate"));
				block();
			}
		}
		else
		{
			alert("UnAuthorized Access");
			navigator.app.exitApp();
		}
		 
		});


	
    //document.addEventListener("deviceready", onDeviceReady, false);
     document.addEventListener("backbutton", onBackKeyDown, false); 
		   
        function onBackKeyDown() {
        	if(localStorage.getItem("stake_level_code")=="1" || localStorage.getItem("stake_level_code")=="2"){
        		window.location = "officer_district_list.html";
        	}
        	else if(localStorage.getItem("stake_level_code")=="3"){
        		window.location = "monitoring.html";
        	}

				//window.location = "officer_district_list.html";
		}


		function block()	
			{	
				$("#block_data").empty();
				$("#block_list").show();
				$("#preloader").fadeIn();

				$.ajax({
			        type: "GET",
			        //url: "https://mdm.wbsed.gov.in/Inspection_Apps/mdm_inspection_app/mdm/block_count",
			        //url: "http://192.168.0.101:80/rtds1/Inspection_Apps/mdm_inspection_app/mdm/block_count",
					url: "https://pmposhan.wb.gov.in/Inspection_Apps/Mdm/block_count",
			        data:{
				    authuser:"16288adbe9a7cb4baeb0f0d8df7ba4bb",
		            authpassword:"001b6d7734d59c236d8eef95842f254e",
		            district_code:localStorage.getItem("district_code"),
		            f_date:localStorage.getItem("o_fdate"),
			        t_date:localStorage.getItem("o_tdate")
				    },
			        dataType:"JSON",
			        success: function(result)
			        {
			        	//alert("succes");
			  			//console.log(JSON.stringify(result));
			  			if(result.rows>0){
				        	for(i=0;i<result.rows;i++){
					        	$("#block_data").append('<tr onclick=gotoschool('+result.block[i].block_code_pk+','+result.block[i].count+')><td>'+(i+1)+'</td><td>'+result.block[i].block_name+'</td><td>'+result.block[i].count+'</td></tr>');
					        }
					    }
					    else{
					    	alert("No Data Found");
					    	//window.location = "monitoring.html";
					    }

				        	$("#preloader").fadeOut();
			        },
				    error: function(error){
				    	//alert("fail");
				    	//alert(JSON.stringify(error));
				    	//console.log(JSON.stringify(error));
			        }
			    });
			}	 

			function gotoschool(bc,c){
				if(c!=0){
					//alert(bc);
					localStorage.setItem("block_code",bc);
					window.location="officer_school_list.html";
				}
				else{
					alert("No School Inspected");
				}
				
			}

			function search(){
				if($("#f_date").val()!=''&&$("#t_date").val()!=''){
					localStorage.setItem("o_fdate",$("#f_date").val());
					localStorage.setItem("o_tdate",$("#t_date").val());
					block();
				}
				else{
					alert("Please select From and To Dates correctly");
					return false;
				}
			}
							

	</script>

<body>

			<div class ="label_display">
			      <label class="head">From</label>
			</div>
			</div>
			<div class="col-md-6 col-sm-6 col-xs-6">
			<div class="label_data">
			      <input type="date" class="form-control" name="f_date" id="f_date">
			</div>
			</div>
			<div class="col-md-6 col-sm-6 col-xs-6">
			<div class ="label_display">
			      <label class="head">To</label>
			</div>
			</div>
			<div class="col-md-6 col-sm-6 col-xs-6">
			<div class="label_data">
			      <input type="date" class="form-control" name="t_date" id="t_date">
			</div>
			</div>
		</div>
		<div class="centarize">
			<button type="button" id="search" class="submit_btn" onclick="search();">Search</button>
