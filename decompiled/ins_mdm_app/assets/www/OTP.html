        function checkLength(len,ele){
          var fieldLength = ele.value.length;
          if(fieldLength <= len){
             
            return true;
          }
          else
          {
            var str = ele.value;
            str = str.substring(0, str.length - 1);
            ele.value = str;
          }
        }

        function otp_success() {

            var mobile_no=localStorage.getItem("phno");
            var stake_level=localStorage.getItem("stake_level_code");
            if($("#otp").val()==''){
                alert("Please enter OTP");
                $("#otp").focus();
                return false;
            }
            else if($("#otp").val().length < 4){
                alert("Please enter Valid OTP");

        function time_out(){
            $("#preloader").fadeOut();
            var x = setInterval(function() {
                countDownDate=get_time;
        //alert("count="+countDownDate);
            // Get todays date and time
            

            // Find the distance between now and the count down date
            var distance = countDownDate - now;
            // Time calculations for days, hours, minutes and seconds
            var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            var seconds = Math.floor((distance % (1000 * 60)) / 1000);
            
            // Output the result in an element with id="demo"
            document.getElementById("timeout_display").innerHTML ="OTP TIME- "+  minutes + "m " + seconds + "s ";
            
            // If the count down is over, write some text 
            if (distance < 0) {
                clearInterval(x);
                document.getElementById("timeout_display").innerHTML = "OTP EXPIRED";
            }
            now+=1000;
        }, 1000);
