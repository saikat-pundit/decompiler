		function School_Dropdown(){
			db.transaction(function(tx){
            tx.executeSql("SELECT * from School_List",[],function(tx,rs){
            	var len = rs.rows.length;
            	//alert(len);
            	for (i=0;i<len;i++){
            		var school_name = rs.rows.item(i)['School_Name'];
					var school_code_pk= rs.rows.item(i)['School_Code'];	
					var msg = "<option value='" + rs.rows.item(i)['School_Code'] +"'>" + rs.rows.item(i)['School_Name'] + "</option>";		
					document.querySelector('#school').innerHTML +=  msg;
            	}
            
            },function(error){
                alert("failed");
            },function(){
                //alert(JSON.stringify(success));
                alert("succes");

            });
        });
		}

	function schoollist(){

		if($("#school").val()==''){
				alert("Select school!");
				$("#school").focus();
				return false;
		    }
		var school_name = document.getElementById("school").options[document.getElementById("school").selectedIndex].text;
		//alert(school_name);
		localStorage.setItem("School_Name", school_name);
		localStorage.setItem("School_Code", $("#school option:selected").val());
		//window.location = "inspection_form.html";
		window.location = "inspection_form_supervisor.html";
