   <style>
		table {
		  font-family: arial, sans-serif;

	<script>
		var count;
		$(document).ready(function(){
		 //alert(localStorage.getItem("name"));	
		if(localStorage.getItem("token")!=null)
		{
			//dist();
			var today = new Date().toISOString().split('T')[0];
			$("#f_date").attr('max', today);
			$("#t_date").attr('max', today);

			if(localStorage.getItem("o_fdate")!=null && localStorage.getItem("o_tdate")!=null){
				$("#f_date").val(localStorage.getItem("o_fdate"));
				$("#t_date").val(localStorage.getItem("o_tdate"));
				dist();
			}
		}
		else
		{
			alert("UnAuthorized Access");
			navigator.app.exitApp();
		}
		 
		});
	
    //document.addEventListener("deviceready", onDeviceReady, false);
     document.addEventListener("backbutton", onBackKeyDown, false); 
		   
        function onBackKeyDown() {
				window.location = "monitoring.html";
		}


		function dist()	
			{	
				$("#dist_data").empty();

				if($("#f_date").val()!=''&&$("#t_date").val()!=''){

					
					$("#dist_list").show();
					$("#preloader").fadeIn();

					$.ajax({
				        type: "GET",
				        //url: "https://mdm.wbsed.gov.in/Inspection_Apps/mdm_inspection_app/mdm/district_count",
				        //url: "http://192.168.0.101:80/rtds1/Inspection_Apps/mdm_inspection_app/mdm/district_count",
						url: "https://pmposhan.wb.gov.in/Inspection_Apps/Mdm/district_count",
				        data:{
					    authuser:"16288adbe9a7cb4baeb0f0d8df7ba4bb",
			            authpassword:"001b6d7734d59c236d8eef95842f254e",
			            f_date:localStorage.getItem("o_fdate"),
			            t_date:localStorage.getItem("o_tdate")
					    },
				        dataType:"JSON",
				        success: function(result)
				        {
				        	//alert("succes");
				  			//console.log(JSON.stringify(result));
				  			if(result.rows>0){
				  				for(i=0;i<result.rows;i++){
					        	$("#dist_data").append('<tr onclick=gotoblock_circle('+result.district[i].district_code_pk+','+result.district[i].count+')><td>'+(i+1)+'</td><td>'+result.district[i].district_name+'</td><td>'+result.district[i].count+'</td></tr>');
					        					
				        		}
				  			}
				  			else{
				  				alert("No Data Found");
				  				//window.location = "monitoring.html";
				  			}

				        	
				        	$("#preloader").fadeOut();
				        },
					    error: function(error){
					    	//alert(JSON.stringify(error));
					    	//console.log(JSON.stringify(error));
				        }
				    });
			}

			}	 

			function gotoblock_circle(dc,c){
				if(c!=0){
					//alert(dc);
					if(localStorage.getItem("stake_level_code")=="1" || localStorage.getItem("stake_level_code")=="2" || localStorage.getItem("stake_level_code")=="3" || localStorage.getItem("stake_level_code")=="5"){
						localStorage.setItem("district_code",dc);
						window.location="officer_block_list.html";
					}
					else if(localStorage.getItem("stake_level_code")=="12" || localStorage.getItem("stake_level_code")=="14" || localStorage.getItem("stake_level_code")=="15"){
						localStorage.setItem("district_code",dc);
						window.location="officer_circle_list.html";
					}


					/*localStorage.setItem("district_code",dc);
					window.location="officer_block_list.html";*/
				}
				else{
					alert("No School Inspected");
				}
				
			}

			function search(){
				if($("#f_date").val()!=''&&$("#t_date").val()!=''){
					var fdate = $("#f_date").val();
					localStorage.setItem("o_fdate",fdate);
					var tdate = $("#t_date").val();
					localStorage.setItem("o_tdate",tdate);
					dist();
				}
				else{
					alert("Please select From & To Date Correctly");
					return false;
				}
				
			}
							

	</script>

<body>

                    <img src="images/inner_logo.png" class="img-responsive">
                </div>
                </div>
                <div class="col-md-3 col-sm-3 col-xs-3">
                <div class="header_home_btn">
                	<a href="officer_Dashboard.html"><img src="images/house.svg" class="img-responsive"></a>
                </div>
                </div>
                
            </div>
            <div class="inner_header_bottom">
                <h2>District wise Inspection</h2>
            </div>
        </div>
    </div>
    <div class="bottom_link">
    	<div class="col-md-12 col-sm-12 col-xs-12">
			<div class="col-md-6 col-sm-6 col-xs-6">
			<div class ="label_display">
			      <label class="head">From</label>
			</div>
			</div>
			<div class="col-md-6 col-sm-6 col-xs-6">
			<div class="label_data">
			      <input type="date" class="form-control" name="f_date" id="f_date">
			</div>
			</div>
			<div class="col-md-6 col-sm-6 col-xs-6">
			<div class ="label_display">
			      <label class="head">To</label>
			</div>
			</div>
			<div class="col-md-6 col-sm-6 col-xs-6">
			<div class="label_data">
			      <input type="date" class="form-control" name="t_date" id="t_date">
			</div>
			</div>
		</div>
		<div class="centarize">
			<button type="button" id="search" class="submit_btn" onclick="search();">Search</button>
		</div>
		<br>
    	<table id="dist_list">
    		<tr>
    			<th id="Sl">Sl no</th>
    			<th id="dist">District Name</th>

    		</tr>
