    <link href="./css/font-awesome.css" rel="stylesheet" type="text/css">

    <script>
    document.addEventListener("deviceready", onDeviceReady, false);
    function onDeviceReady() {
        console.log(device.cordova);
    }

    document.addEventListener("backbutton", onBackKeyDown, false); 
           
    function onBackKeyDown() {
                    //navigator.app.exitApp();
                    window.location="Welcome.html";
                }
        function checkLength(len,ele){
          var fieldLength = ele.value.length;
          if(fieldLength <= len){
             
            return true;
          }
          else
          {
            var str = ele.value;
            str = str.substring(0, str.length - 1);
            ele.value = str;
          }
        }
        
        function signup_page()
        {
        
        window.location = "inspector_registration.html";
        }
        function login_page()
        {
        if($('#phone_number').val()=='')
        {
            alert("Enter Mobile No."); 
            $("#phone_number").focus();
            return false;       
        }
        else if($('#phone_number').val().length < 10)
        {
            alert("Enter 10 Digit Only.");
            $("#phone_number").focus();
            return false;
        }
        else
        {   
            $("#preloader").fadeIn();
            $.ajax({
            type: "GET",
            /*url:"https://mdm.wbsed.gov.in/mdm_app/mdm/login_inspector"*/
            //url:"https://mdm.wbsed.gov.in/Inspection_Apps/mdm_es_inspection_app/mdm_es_insp/login_inspector_supervisor",
            //url:"https://mdm.wbsed.gov.in/Inspection_Apps/mdm_inspection_app/mdm/login",
            url:"https://pmposhan.wb.gov.in/Inspection_Apps/Mdm/login",
            data:{
                authuser:'16288adbe9a7cb4baeb0f0d8df7ba4bb',
                authpassword:'001b6d7734d59c236d8eef95842f254e',
                mobile_no:$('#phone_number').val(),
                device_uuid:device.uuid
                },      
            dataType:"JSON",
            success: function(result)
            {   
            console.log(JSON.stringify(result));
                if(result.otp_error == "Sorry")
                {
                //alert("Your Mobile no. is not registered as a ES,\nplease contact your SI office.");
                    alert("Sorry! Your mobile number is not registered");
                window.location = "Login.html";
                }
                else
                {
                //alert(result.otp);
                //alert(result.time);
                localStorage.setItem("stake_level_code",result.stake_level_code_fk);
                localStorage.setItem("full_name",result.full_name);
                localStorage.setItem("phno", result.phno);
                localStorage.setItem("time", result.time);
                localStorage.setItem("sl_no", result.sl_no);
                localStorage.setItem("check_name_status","0");
                window.location = "OTP.html"
                }               
            $("#preloader").fadeOut();              
            }
            });     
        }
    }
</script>


</head>


<body>

<div id="preloader" style="display:none;">
<div class="cssload-container">
<div class="cssload-speeding-wheel"></div>
</div>
</div>

<h4>School Education Department</h4>
<h4>Government of West Bengal</h4>
</div>
</div>

<div class="wrapper">
<div class="inner">
<div class="form-box">
    <h2 class="heading mbotm60">Login</h2>


<div class="form-group">
<input type="number" class="form-control" id="phone_number" onInput="checkLength(10,this)" placeholder="Enter mobile number">
</div>
<div class="form-group">
<button type="button" class="btn login_btn mtop40" id="LoginButton" onclick="login_page()">Request For OTP</button>
</div>


</div>
</div>
</div>

</div>
